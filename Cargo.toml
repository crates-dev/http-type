[package]
name = "http-type"
version = "20.0.6"
readme = "README.md"
edition = "2024"
authors = ["root@ltpp.vip"]
license = "MIT"
description = """A comprehensive Rust type library for HTTP operations and concurrent programming. Provides core HTTP types (Request/Response with builder patterns, Method, HttpStatus, HttpVersion, ContentType, FileExtension with MIME mapping, Cookie parsing/building, HttpUrl parsing, WebSocket frame/opcode, protocol upgrade types, stream/task management, panic handling), thread-safe concurrent wrappers (ArcMutex, ArcRwLock, BoxRwLock, RcRwLock), dynamic dispatch types (BoxAny, RcAny, ArcAny with Send/Sync variants), high-performance hash collections (HashMapXxHash3_64, HashSetXxHash3_64), and static lifetime utilities (BoxLeak, Lifetime trait)."""
keywords = ["http", "request", "response", "tcp", "redirect"]
repository = "https://github.com/crates-dev/http-type.git"
categories = ["network-programming", "web-programming"]
exclude = ["target", "Cargo.lock", "sh", ".github"]

[dependencies]
h3 = "0.0.8"
hex = "0.4.3"
h2 = "0.4.15"
url = "2.5.8"
http = "1.4.2"
bytes = "1.12.0"
h3-quinn = "0.0.10"
serde_json = "1.0.150"
serde-xml-rs = "0.8.2"
http-constant = "5.5.2"
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
http-compress = "3.0.21"
lombok-macros = "2.0.29"
serde_urlencoded = "0.7.1"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
rustls = { version = "0.23.40", features = ["ring"] }
quinn = { version = "0.11.9", features = ["runtime-tokio", "ring"] }

[profile.dev]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"

[profile.release]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"
